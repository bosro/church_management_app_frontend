<!-- src/app/features/settings/components/subscription-callback/subscription-callback.html -->
<div class="dashboard-layout">
  <app-sidebar></app-sidebar>
  <div class="dashboard-content">
    <app-header></app-header>
    <div class="dashboard-body">
      <div class="callback-page">

        <!-- Verifying -->
        <div *ngIf="state === 'verifying'" class="callback-card">
          <div class="spinner-wrap">
            <div class="big-spinner"></div>
          </div>
          <h2>Verifying payment...</h2>
          <p>Please wait while we confirm your subscription payment.</p>
          <p><strong>Do not close this tab.</strong></p>
          <p class="sub">This usually takes less than 15 seconds.</p>
        </div>

        <!-- Success -->
        <div *ngIf="state === 'success'" class="callback-card">
          <div class="icon-circle success-circle">
            <i class="ri-vip-crown-fill"></i>
          </div>
          <h2>Plan Upgraded!</h2>
          <p>{{ message }}</p>
          <p class="sub">Redirecting you to your subscription settings...</p>
          <button class="btn-primary" (click)="goToSettings()">
            <i class="ri-settings-3-line"></i>
            Go to Settings
          </button>
        </div>

        <!-- Failed -->
        <div *ngIf="state === 'failed'" class="callback-card">
          <div class="icon-circle failed-circle">
            <i class="ri-close-circle-fill"></i>
          </div>
          <h2>Payment Not Completed</h2>
          <p>{{ message }}</p>
          <div class="btn-row">
            <button class="btn-secondary" (click)="goToSettings()">
              <i class="ri-home-line"></i>
              Go to Settings
            </button>
            <button class="btn-primary" (click)="tryAgain()">
              <i class="ri-refresh-line"></i>
              Try Again
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
