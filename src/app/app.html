<!-- src/app/app.html  —  FULL REPLACEMENT -->

<div *ngIf="!authInitialized" class="auth-loading">
  <div class="loading-spinner"></div>
  <p>Loading...</p>
</div>

<div *ngIf="authInitialized">
  <router-outlet></router-outlet>

  <!-- ── PWA Install Banner (Goatfunded-style bottom bar) ─────────────── -->
  <!-- Shows only when browser fires beforeinstallprompt AND user hasn't dismissed -->
  <div class="pwa-install-banner" *ngIf="showInstallBanner" @slideUp>
    <div class="install-banner-content">
      <!-- App icon -->
      <img
        src="icons/icon-72x72.png"
        alt="Churchman"
        class="install-banner-icon"
      />

      <!-- Text -->
      <div class="install-banner-text">
        <span class="install-banner-title">Install Churchman for a smoother experience.</span>
      </div>

      <!-- Actions -->
      <div class="install-banner-actions">
        <button class="install-btn-notNow" (click)="dismissInstall()">
          Not now
        </button>
        <button class="install-btn-install" (click)="installApp()">
          <i class="ri-download-line"></i>
          Install
        </button>
      </div>
    </div>
  </div>

  <!-- ── PWA Update Banner ─────────────────────────────────────────────── -->
  <div class="pwa-update-banner" *ngIf="updateAvailable" @slideUp>
    <div class="update-content">
      <div class="update-icon">
        <i class="ri-refresh-line"></i>
      </div>
      <div class="update-text">
        <span class="update-title">Update available</span>
        <span class="update-sub">A new version of Churchman is ready</span>
      </div>
      <div class="update-actions">
        <button class="update-btn" (click)="updateApp()">Update now</button>
        <button class="dismiss-btn" (click)="dismissUpdate()" aria-label="Dismiss">
          <i class="ri-close-line"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- ── Offline Banner ────────────────────────────────────────────────── -->
  <div class="offline-banner" *ngIf="isOffline" @slideUp>
    <div class="offline-content">
      <i class="ri-wifi-off-line"></i>
      <span>You're offline — some features may be unavailable</span>
    </div>
  </div>
</div>
