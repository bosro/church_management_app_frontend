<div class="toast-stack" aria-live="polite">
  <div class="toast" *ngFor="let t of toasts.toasts$ | async; trackBy: trackById" [ngClass]="t.kind" role="status">
    <div class="t-icon">
      <i class="ri-loader-4-line spin" *ngIf="t.kind === 'progress'"></i>
      <i class="ri-checkbox-circle-fill" *ngIf="t.kind === 'success'"></i>
      <i class="ri-error-warning-fill" *ngIf="t.kind === 'error'"></i>
      <i class="ri-alert-fill" *ngIf="t.kind === 'warning'"></i>
      <i class="ri-information-fill" *ngIf="t.kind === 'info'"></i>
    </div>
    <div class="t-body">
      <div class="t-title">{{ t.title }}<span class="t-pct" *ngIf="t.kind === 'progress'">{{ t.percent }}%</span></div>
      <div class="t-msg" *ngIf="t.message">{{ t.message }}</div>
      <div class="t-bar" *ngIf="t.kind === 'progress'"><div class="t-fill" [style.width.%]="t.percent"></div></div>
    </div>
    <button class="t-close" *ngIf="t.kind !== 'progress'" (click)="toasts.dismiss(t.id)" aria-label="Dismiss"><i class="ri-close-line"></i></button>
  </div>
</div>
